spring:
  application:
    name: nhalo24h-backend

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    enabled: true

app:
  api:
    prefix: /api/v1
  upload:
    dir: ${UPLOAD_DIR:uploads}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8080/uploads}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      exposed-headers: Authorization
      allow-credentials: true
      max-age-seconds: 3600
  jwt:
    secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  seed:
    admin:
      enabled: ${SEED_ADMIN_ENABLED:true}
      email: ${SEED_ADMIN_EMAIL:admin@nhalo24h.com}
      password: ${SEED_ADMIN_PASSWORD:Admin1234}
      full-name: ${SEED_ADMIN_FULL_NAME:Quản Trị Viên Hệ Thống}
      phone: ${SEED_ADMIN_PHONE:0900000000}
